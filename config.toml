# PRIME PR Review Agent — configuration
#
# Secrets NEVER go in this file. They are read from environment variables:
#   GITHUB_TOKEN               - repo access for gh CLI
#   PRIME_REVIEW_WEBHOOK_URL   - Slack/Discord/generic webhook
# See .env.example.

[repo]
# Throwaway demo repo with four seeded PRs and a known answer key.
# Swap to the real project once the reviews look trustworthy.
owner = "RonKat2008"
name = "prime-agent-review-demo"

[schedule]
# Cron expressions handed to `prime-agent schedule add`.
open_prs = "0 */4 * * *"      # every 4 hours
merged_prs = "0 9 * * 1-5"    # weekday mornings at 09:00

[review]
# SAFETY: while true, reviews are written locally and pushed to the webhook,
# but NOT posted as PR comments. Flip to false when you trust the output.
dry_run = true

# Findings below this confidence are recorded locally but never posted.
min_confidence = 0.7

# Hard cap on comments per sweep, so a bad prompt cannot spray the repo.
max_comments_per_sweep = 5

# How far back the merged-PR lane looks on a cold start.
merged_lookback_days = 7

# PRs authored by this login are skipped (prevents self-review loops).
# TODO: set to the bot/account the agent posts as.
bot_login = ""

# Files matching these globs are stripped from diffs before review.
ignore_paths = [
    "**/*.lock",
    "**/package-lock.json",
    "**/uv.lock",
    "**/*.snap",
    "**/dist/**",
    "**/build/**",
    "**/*.min.js",
]

# Diffs larger than this are truncated with a marker (token guard).
max_diff_bytes = 200000

# --- Context gathering (P1) -------------------------------------------------
# Give the reviewer more than the diff: the full changed files, call sites of
# changed symbols, sibling tests, and the repo's own conventions.
#
# repo_root must point at a local checkout of the REVIEWED repository. Call-site
# discovery shells out to `git grep` and sibling-test discovery globs the disk,
# so both need the target repo present. Left empty, those two sections are
# skipped — pointing it at the wrong checkout would surface call sites from an
# unrelated codebase, which is worse than surfacing none.
#
# Under GitHub Actions this is simply the workspace, so it becomes automatic.
# TODO: set when you have the target repo cloned locally.
repo_root = ""
gather_context = true
max_context_bytes = 400000

# --- Intent alignment (P8) --------------------------------------------------
# Two-pass check: does the diff do what the PR says it does? Pass 1 derives the
# intent from title/body/commits with the diff withheld; pass 2 judges the diff
# against that fixed statement.
check_intent = true

[sinks]
pr_comment = true       # gated by review.dry_run
webhook = false         # no webhook URL configured yet
local_file = true       # always on; the audit trail
webhook_kind = "slack"  # slack | discord | generic
