# PRIME PR Review Agent — configuration
#
# Secrets NEVER go in this file. They are read from environment variables:
#   GITHUB_TOKEN               - repo access for gh CLI
#   PRIME_REVIEW_WEBHOOK_URL   - Slack/Discord/generic webhook
# See .env.example.

[repo]
# Throwaway demo repo with four seeded PRs and a known answer key.
# Swap to the real project once the reviews look trustworthy.
owner = "RonKat2008"
name = "prime-agent-review-demo"
# Standing write-ban for the configured repo: reviews are still produced locally,
# but the comment sink is refused no matter what dry_run says. MUST be true
# whenever this points at example-org/service-a or example-org/service-b (owner's
# instruction: never upload anything to those repos).
read_only = false

# --- Multi-repo targets (A5) -------------------------------------------------
# One agent instance serves both target repos. [repo]/[review] above remain the
# fallback used only when no [[repos]] entries exist (e.g. the demo config
# above). Once [[repos]] is populated, pick the active entry per invocation
# with `--repo <owner/name or bare name>` (case-insensitive); resolve_active()
# rewrites [repo] and review.repo_root/graph_path onto a copy of Config from
# the chosen entry, so the sweep itself never sees more than one repo.
#
# read_only = true on BOTH entries is the owner's standing instruction: never
# upload anything to either repo. It is a hard write-ban the comment sink
# honors regardless of dry_run (see RepoConfig.read_only in config.py).
[[repos]]
owner = "example-org"
name = "service-a"
read_only = true
# Local checkout. Note: git-grep-based call sites read the working tree, which
# may sit on a feature branch; the graph freshness check uses origin/<base>
# and is unaffected.
repo_root = "/home/user/Projects/service-a"
graph_path = "graphs/service-a-cochange.json"

[[repos]]
owner = "example-org"
name = "service-b"
read_only = true
repo_root = "/home/user/Projects/service-b"
graph_path = "graphs/service-b-cochange.json"

[schedule]
# Cron expressions handed to `prime-agent schedule add`.
open_prs = "0 */4 * * *"      # every 4 hours
merged_prs = "0 9 * * 1-5"    # weekday mornings at 09:00

[review]
# SAFETY: while true, reviews are written locally and pushed to the webhook,
# but NOT posted as PR comments. Flip to false when you trust the output.
# Flipped back to true after the live demo-repo posting run: reviews stay in
# the local md files by default (owner's preference); flip per-run when a live
# posting demo is wanted.
dry_run = true

# Findings below this confidence are recorded locally but never posted.
# 0.3 for the live demo repo: recall-mode agreement of 1/3 seats is 0.33,
# and a grounded single-seat finding should still post there.
min_confidence = 0.3

# Hard cap on comments per sweep, so a bad prompt cannot spray the repo.
max_comments_per_sweep = 5

# How far back the merged-PR lane looks on a cold start.
merged_lookback_days = 7

# PRs authored by this login are skipped (prevents self-review loops).
# TODO: set to the bot/account the agent posts as.
bot_login = ""

# Files matching these globs are stripped from diffs before review.
ignore_paths = [
    "**/*.lock",
    "**/package-lock.json",
    "**/uv.lock",
    "**/*.snap",
    "**/dist/**",
    "**/build/**",
    "**/*.min.js",
]

# Diffs larger than this are truncated with a marker (token guard).
max_diff_bytes = 200000

# --- Context gathering (P1) -------------------------------------------------
# Give the reviewer more than the diff: the full changed files, call sites of
# changed symbols, sibling tests, and the repo's own conventions.
#
# repo_root must point at a local checkout of the REVIEWED repository. Call-site
# discovery shells out to `git grep` and sibling-test discovery globs the disk,
# so both need the target repo present. Left empty, those two sections are
# skipped — pointing it at the wrong checkout would surface call sites from an
# unrelated codebase, which is worse than surfacing none.
#
# Under GitHub Actions this is simply the workspace, so it becomes automatic.
# TODO: set when you have the target repo cloned locally.
# Verified working by cloning the target repo and running the sweep from inside it:
#   cd <checkout> && python <agent>/scripts/run_sweep.py --config <agent>/config.toml
repo_root = ""
gather_context = true
max_context_bytes = 400000

# --- Knowledge graph (P10) --------------------------------------------------
# Graph file for the reviewed repo (schema: docs/KNOWLEDGE-GRAPH.md). Mined ones
# live in graphs/ (gitignored):
#   graphs/service-a-cochange.json     - example-org/service-a    @ origin/main
#   graphs/service-b-cochange.json  - example-org/service-b @ origin/main
# Empty = no graph; a stale graph is refused with a note, never trusted.
graph_path = ""

# --- Ensemble agreement (P2) ------------------------------------------------
# 3 independent review runs per PR on three different model families, and
# confidence becomes the observed agreement ratio instead of the model's
# self-report (which pinned at 95% on every PR with a single run).
#
# min_agreement = 1 (RECALL MODE): every finding any seat reports is kept,
# tagged with its agreement ("1/3 reviewers"). Measured on service-b #2700:
# the three seats found four plausible MEDIUM bugs in four different files,
# and min_agreement = 2 dropped ALL of them as "Clean". While both target repos
# are read_only and reviews are local-only, recall is the right trade; raise
# to 2 before ever posting publicly, or better, add the refutation pass (P14)
# as the precision gate instead of requiring finders to agree.
# Cost lever: ensemble_size = 1 for cheap single-call reviews.
ensemble_size = 3
min_agreement = 1

# --- Skeptic pass (P14) -------------------------------------------------------
# After the ensemble merges, a dedicated adversary model tries to DISPROVE each
# finding with concrete grounds. Refuted findings are annotated (folded into a
# "challenged" section of the review, excluded from inline comments, blocking
# status, and suggestion blocks) — never dropped. This is the precision gate
# that makes recall mode (min_agreement = 1 above) safe: precision comes from
# an adversary, not from finders happening to agree.
check_refute = true

# --- Judge-merge pass (P15) ---------------------------------------------------
# Before agreement is counted, a judge model clusters same-file findings that
# describe the same defect (seats report one bug at different lines/severities,
# and the deterministic line-bucket match misses those). Merge-only,
# same-file-only, falls back to deterministic grouping on any failure.
judge_merge = true

# --- Intent alignment (P8) --------------------------------------------------
# Two-pass check: does the diff do what the PR says it does? Pass 1 derives the
# intent from title/body/commits with the diff withheld; pass 2 judges the diff
# against that fixed statement.
check_intent = true

[sinks]
pr_comment = true       # gated by review.dry_run
webhook = false         # no webhook URL configured yet
local_file = true       # always on; the audit trail
webhook_kind = "slack"  # slack | discord | generic

# Public OSS target for evaluation. READ-ONLY IS NON-NEGOTIABLE: this agent
# must never post on a project that has not invited it. Reviews land in
# reviews/ locally, exactly like the example-org targets.
[[repos]]
owner = "django"
name = "django"
read_only = true
repo_root = "/home/user/Projects/django"
graph_path = "graphs/django-cochange.json"

# The demo/answer-key repo, kept selectable for scorer runs: --repo prime-agent-review-demo
[[repos]]
owner = "RonKat2008"
name = "prime-agent-review-demo"
read_only = false
repo_root = "/home/user/Projects/prime-agent-review-demo"
