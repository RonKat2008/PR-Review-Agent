[project]
name = "prime-pr-review"
version = "0.1.0"
description = "PRIME agent skill that reviews open and recently merged PRs for introduced and fixed bugs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
prime-review = "prime_pr_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prime_pr_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=prime_pr_review --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["prime_pr_review/__main__.py"]
